spring:
  application:
    name: subsense
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/subsense}
    username: ${DB_USERNAME:subsense}
    password: ${DB_PASSWORD:subsense}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

subsense:
  reporting-currency: ${SUBSENSE_REPORTING_CURRENCY:GBP}
  time-zone: ${SUBSENSE_TIME_ZONE:Europe/London}
  fx:
    base-url: ${SUBSENSE_FX_BASE_URL:https://api.frankfurter.dev/v1}
    refresh-cron: ${SUBSENSE_FX_REFRESH_CRON:0 0 6 * * *}
    refresh-on-startup: ${SUBSENSE_FX_REFRESH_ON_STARTUP:true}
  rollover:
    cron: ${SUBSENSE_ROLLOVER_CRON:0 15 0 * * *}
    run-on-startup: ${SUBSENSE_ROLLOVER_ON_STARTUP:true}
  ntfy:
    server: ${SUBSENSE_NTFY_SERVER:https://ntfy.sh}
    topic: ${SUBSENSE_NTFY_TOPIC:}
    token: ${SUBSENSE_NTFY_TOKEN:}
    retry-backoff: ${SUBSENSE_NTFY_RETRY_BACKOFF:1s}
  reminders:
    offsets: ${SUBSENSE_REMINDER_OFFSETS:14,7,1}
    cron: ${SUBSENSE_REMINDER_CRON:0 0 8 * * *}
    run-on-startup: ${SUBSENSE_REMINDER_ON_STARTUP:true}
  app-url: ${SUBSENSE_APP_URL:http://localhost:3000}
  jobs:
    # Test-only POST /api/v1/jobs/rollover and /jobs/reminders; never enable outside e2e tests.
    manual-trigger: ${SUBSENSE_JOBS_MANUAL_TRIGGER:false}
