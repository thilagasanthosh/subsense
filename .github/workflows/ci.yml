name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Format check, unit tests, Testcontainers integration tests and JaCoCo report
      - run: mvn -B -pl backend verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check src
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SUBSENSE_FX_BASE_URL: http://fx-stub:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start the stack with stubbed exchange rates
        run: docker compose --profile e2e up -d --build --wait
      - name: Install the Playwright browser
        run: mvn -B -pl e2e test-compile exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - name: Run Cucumber scenarios
        run: mvn -B -pl e2e verify
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cucumber-report
          path: e2e/target/cucumber-report.html
          if-no-files-found: ignore
